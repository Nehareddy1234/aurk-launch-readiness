# Review against the live configuration before installation.
# Certificate paths assume the existing aurk.in certificate covers both names.
# Include this file from the nginx http context. Avoid reset tokens in access logs.
log_format aurk_safe '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent $request_time';
server {
    access_log /var/log/nginx/aurk_access.log aurk_safe;
    listen 80;
    server_name aurk.in www.aurk.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://aurk.in$request_uri; }
}
server {
    access_log /var/log/nginx/aurk_access.log aurk_safe;
    listen 443 ssl;
    server_name www.aurk.in;
    ssl_certificate /etc/letsencrypt/live/aurk.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurk.in/privkey.pem;
    return 301 https://aurk.in$request_uri;
}
server {
    access_log /var/log/nginx/aurk_access.log aurk_safe;
    listen 443 ssl;
    server_name aurk.in;
    ssl_certificate /etc/letsencrypt/live/aurk.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurk.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;
    location /static/ {
        alias /var/www/aurk/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx is the only trusted public reverse proxy in this configuration.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}

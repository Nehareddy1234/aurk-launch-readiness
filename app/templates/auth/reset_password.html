{% extends 'admin/base.html' if admin_reset else 'base.html' %}
{% block title %}Choose a new password &mdash; AURK{% endblock %}
{% block content %}<section class="form-card">
<h1>Choose a new password</h1><p>Your email reset link is verified. Choose a password with at least 12 characters.</p>
<form method="post" data-submit-once>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="new-password">New password</label>
<input id="new-password" type="password" name="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" type="password" name="confirm_password" minlength="12" maxlength="1024" autocomplete="new-password" required>
<button class="button" type="submit">Save new password</button>
</form></section>{% endblock %}

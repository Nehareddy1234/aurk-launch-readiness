<div class="variant-fields" data-variant-fields>
<label data-combined-label>Size / colour<select name="variant_id" required>{% set available = namespace(count=0) %}<option value="">Choose an option</option>{% for variant in product.variants %}{% if variant.is_active %}{% set stock = [variant.inventory.quantity - variant.inventory.reserved_quantity,0]|max if variant.inventory else 0 %}{% set price = variant.price_override if variant.price_override is not none else product.current_price %}<option value="{{ variant.id }}" data-size-id="{{ variant.size_id }}" data-colour-id="{{ variant.color_id }}" data-size="{{ ('S' if variant.size.name|trim|lower == 's' else variant.size.name) if variant.size else 'One size' }}" data-colour="{{ variant.color.name if variant.color else 'Default' }}" data-stock="{{ [stock,99]|min }}" data-original-price="{{ product.base_price if product.sale_price is not none and product.sale_price < product.base_price and variant.price_override is none else '' }}" data-price="{{ '%.2f'|format(price) }}" {% if stock == 0 %}disabled{% endif %} {% if selected_variant is defined and selected_variant and selected_variant.id == variant.id %}selected{% endif %}>{{ ('S' if variant.size.name|trim|lower == 's' else variant.size.name) if variant.size else 'One size' }} / {{ variant.color.name if variant.color else 'Default' }}{{ ' (Sold out)' if stock == 0 else '' }}</option>{% endif %}{% endfor %}</select></label>
<div class="separate-variant-fields" data-separate-fields hidden><label>Colour<select data-colour-select aria-label="Colour for {{ product.name }}"></select></label><label>Size<select data-size-select aria-label="Size for {{ product.name }}"></select></label></div>
<button type="button" class="size-chart-trigger" data-size-chart-open aria-haspopup="dialog" aria-controls="aurk-size-chart">Size chart</button>
</div>
